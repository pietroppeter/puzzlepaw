name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/webui.nim'
      - 'src/parloku/types.nim'
      - 'data/*.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install atlas
        run: nimble install "https://github.com/nim-lang/atlas" -y

      - name: Install dependencies via atlas
        run: |
          atlas use nimib
          atlas use karax

      - name: Build web UI
        run: nim r src/webui.nim

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
